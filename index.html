<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Снежный город</title>
<meta name="description" content="Новогодний город, где каждый подписчик — свой дом.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed WebGL city. Frosted "postcard glass" UI: crest top-left, clock top-right,
   a single dock at the bottom; house details open as a residency card ("прописка") above the dock. */
:root{
  --glass:rgba(247,250,255,.88); --glass-2:rgba(232,239,252,.92);
  --ink:#152043; --muted:#5a6688; --line:rgba(21,32,67,.13);
  --red:#d8352f; --red-deep:#a3211d; --gold:#e9b649; --pine:#1f6a52;
  --f-script:"Lobster","Georgia",serif;
  --f-ui:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --top:calc(env(safe-area-inset-top,0px) + 12px);
  --bot:calc(env(safe-area-inset-bottom,0px) + 12px);
  --dock-h:62px;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#0b1027;color:var(--ink)}
body{font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 30px rgba(5,10,35,.28)}

/* ники над домами: ёлочная бирка на нитке */
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.lbl{position:absolute;left:0;top:0;will-change:transform,opacity;opacity:0;pointer-events:none;cursor:pointer;
  display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:9px;white-space:nowrap;
  font:800 12.5px/1.2 var(--f-ui);color:var(--ink);background:rgba(250,252,255,.94);box-shadow:0 3px 10px rgba(5,10,35,.35)}
.lbl::before{content:"";width:9px;height:9px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 35%,#ff8f86,var(--red) 55%,var(--red-deep));}
.lbl::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:9px;background:var(--gold);transform:translateX(-50%)}
.lbl.anon{color:var(--muted);font-style:italic}
.lbl.sel{background:var(--red);color:#fff;font-size:14px;z-index:5}
.lbl.sel::before{background:radial-gradient(circle at 35% 35%,#fff6d8,var(--gold) 60%,#b98420)}

.ui{position:fixed;inset:0;pointer-events:none;z-index:3;transition:opacity .4s}
.ui > *{pointer-events:auto}
body.cinema .ui{opacity:0}
body.cinema .ui > *{pointer-events:none}

/* герб города */
.crest{position:absolute;left:var(--gut-l);top:var(--top);width:min(300px, calc(100% - 32px - 112px));
  border-radius:20px;padding:12px 14px 12px;display:grid;gap:8px;text-align:left}
.crest h1{margin:0;font:400 clamp(26px,7vw,32px)/1 var(--f-script);color:var(--red);letter-spacing:.005em}
.crest .count{margin:0;font:700 13px/1.3 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.crest .count b{color:var(--ink);font-weight:800}
.garland{display:grid;gap:6px;padding-top:8px;border-top:1px dashed var(--line);text-align:left;width:100%;color:inherit}
.bulbs{display:flex;justify-content:space-between;align-items:flex-start;height:16px;position:relative}
.bulbs::before{content:"";position:absolute;left:0;right:0;top:2px;height:6px;border-top:1.5px solid #8a93ad;border-radius:50%/0 0 100% 100%}
.bulbs i{position:relative;width:8px;height:12px;margin-top:4px;border-radius:50% 50% 45% 45%;background:#c5cbdb}
.bulbs i.on:nth-child(4n+1){background:var(--red);box-shadow:0 0 8px #ff6a5f}
.bulbs i.on:nth-child(4n+2){background:var(--gold);box-shadow:0 0 8px #ffd16a}
.bulbs i.on:nth-child(4n+3){background:#2fa36f;box-shadow:0 0 8px #5ee0a0}
.bulbs i.on:nth-child(4n){background:#3d74e0;box-shadow:0 0 8px #7aa8ff}
.garland .next{font:700 12.5px/1.3 var(--f-ui);color:var(--muted)}
.garland .next b{color:var(--red);font-weight:800}

.clock{position:absolute;right:var(--gut-r);top:var(--top);border-radius:16px;padding:9px 12px;display:grid;gap:2px;text-align:right;min-width:96px}
.clock .t{font:800 20px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.clock .w{font:700 11.5px/1.2 var(--f-ui);color:var(--muted)}

/* док */
.dock{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--bot);
  width:min(600px, calc(100% - 32px));height:var(--dock-h);border-radius:22px;padding:7px;display:flex;align-items:center;gap:6px}
.search{flex:1;min-width:0;display:flex;align-items:center;height:100%;border-radius:16px;background:#fff;border:1px solid var(--line);padding-left:12px}
.search svg{width:18px;height:18px;flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 8px;font:700 16px/1 var(--f-ui);color:var(--ink);outline:none}
.search input::placeholder{color:#8f99b5}
.search input::-webkit-search-cancel-button{display:none}
.go{width:40px;height:40px;margin-right:4px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center;flex:none}
.go svg{width:18px;height:18px;color:#fff}
.go:active{transform:scale(.94)}
.dbtn{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:var(--ink);flex:none}
.dbtn svg{width:22px;height:22px}
.dbtn:hover{background:rgba(21,32,67,.06)}
.dbtn.on{background:var(--ink);color:#fff}
.dbtn:active{transform:scale(.94)}
.sep{width:1px;height:28px;background:var(--line);flex:none}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--dock-h) + 10px);
  width:min(480px, calc(100% - 32px));margin:0;padding:11px 14px;border-radius:16px;font:700 14px/1.4 var(--f-ui)}
.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--dock-h) + 12px);
  padding:8px 14px;border-radius:999px;font:700 13px/1.2 var(--f-ui);white-space:nowrap;transition:opacity .6s;pointer-events:none;opacity:0}

/* карточка «прописка» */
.card{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + var(--dock-h) + 10px);
  width:min(440px, calc(100% - 32px));border-radius:22px;overflow:hidden;display:grid}
.strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px 9px 16px;background:var(--red);color:#fff}
.strip span{font:400 20px/1 var(--f-script)}
.strip small{font:800 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.18);color:#fff;flex:none}
.x svg{width:16px;height:16px}
.card-body{position:relative;padding:14px 16px 16px;display:grid;gap:11px}
.who{padding-right:92px;min-width:0}
.who h2{margin:0;font:800 clamp(20px,5.8vw,25px)/1.15 var(--f-ui);overflow-wrap:anywhere;letter-spacing:-.01em}
.addr{margin:5px 0 0;font:800 15px/1.3 var(--f-ui);color:var(--pine)}
.meta{margin:3px 0 0;font:700 13px/1.35 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}
.stamp{position:absolute;right:14px;top:12px;width:84px;height:84px;border-radius:50%;border:2.5px solid var(--red);
  display:grid;place-content:center;text-align:center;transform:rotate(-12deg);color:var(--red);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.6), inset 0 0 0 5.5px rgba(216,53,47,.55)}
.stamp small{font:800 8.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.stamp b{font:800 22px/1.05 var(--f-ui);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stamp em{font:700 9.5px/1 var(--f-ui);font-style:normal;opacity:.85}
.neigh{display:grid;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.k{font:800 10.5px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nchips{display:flex;flex-wrap:wrap;gap:6px}
.nchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;background:#fff;border:1px solid var(--line);
  font:800 13px/1 var(--f-ui);max-width:100%;color:var(--ink)}
.nchip span{color:var(--muted);font-weight:700}
.nchip em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{margin:0;font:600 12.5px/1.4 var(--f-ui);color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:46px;border-radius:14px;font:800 14.5px/1 var(--f-ui)}
.btn.primary{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red-deep)}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:active{transform:translateY(1px)}

/* съёмка */
.field{display:grid;gap:8px}
.field .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.field label{font:800 14px/1.2 var(--f-ui)}
.field output{font:800 16px/1 var(--f-ui);color:var(--red);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--red);height:26px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 12px;border-radius:11px;background:#fff;border:1px solid var(--line);font:800 13.5px/1 var(--f-ui);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:13px;background:#fff;border:1px solid var(--line);font:800 14px/1.2 var(--f-ui)}
.tg input{width:20px;height:20px;accent-color:var(--red)}
.plist{display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:12px;min-height:50px;padding:6px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);
  font:800 15px/1.2 var(--f-ui);color:var(--ink);text-align:left;width:100%}
.prow i{font-style:normal;font-size:20px;width:26px;text-align:center;flex:none}
.prow span{flex:1;min-width:0}
.prow em{font-style:normal;font:800 13px/1 var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.prow:active{transform:translateY(1px)}

.modal{position:fixed;inset:0;z-index:20;background:rgba(5,7,20,.82);display:grid;place-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 16px) var(--gut-l)}
.modal-in{display:grid;gap:12px;justify-items:center;max-height:100%;width:100%;max-width:380px}
.modal img{max-height:68vh;width:auto;max-width:100%;border-radius:18px;-webkit-touch-callout:default;user-select:auto}
.modal p{margin:0;text-align:center;font:700 15px/1.4 var(--f-ui);color:#f3f6ff}

.loading{position:fixed;inset:0;z-index:30;display:grid;place-content:center;gap:10px;text-align:center;background:#0b1027;transition:opacity .7s;padding:0 var(--gut-r) 0 var(--gut-l)}
.loading h2{margin:0;font:400 40px/1 var(--f-script);color:#ff6a5f}
.loading p{margin:0;font:700 15px/1.4 var(--f-ui);color:#b9c3e2;max-width:340px}
.loading.done{opacity:0;pointer-events:none}
.exitc{position:fixed;z-index:4;right:var(--gut-r);top:var(--top);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  color:var(--ink);opacity:0;pointer-events:none;transition:opacity .4s}
.exitc svg{width:18px;height:18px}
body.cinema .exitc{opacity:.4;pointer-events:auto}

@media (max-width:420px){ .dbtn{width:42px;height:42px} .dock{gap:3px;padding:6px} .sep{display:none} }
@media (max-height:620px){ .garland{display:none} }
@media (prefers-reduced-motion:reduce){ .ui,.hint,.loading{transition:none} }
</style>
<style>html{color-scheme:dark}body{margin:0}:root{padding:0}</style>
</head>
<body>
<canvas id="c" aria-label="Снежный город: каждый дом — подписчик"></canvas>
<div id="labels"></div>

<div class="ui" id="ui">
  <div class="crest glass">
    <h1>Снежный город</h1>
    <p class="count" id="sub">—</p>
    <button class="garland" id="unlock" type="button" aria-label="Показать следующее открытие">
      <span class="bulbs" id="bulbs" aria-hidden="true"></span>
      <span class="next" id="unlockTxt">—</span>
    </button>
  </div>

  <div class="clock glass" aria-live="off">
    <span class="t" id="clockT">--:--</span>
    <span class="w" id="clockW">—</span>
  </div>

  <p class="toast glass" id="toast" hidden></p>
  <div class="hint glass" id="hint"></div>

  <section class="card glass" id="card" hidden aria-live="polite">
    <div class="strip"><span>Прописка</span><small>Снежный город</small><button class="x" id="cClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="card-body">
      <div class="stamp" aria-hidden="true"><small>житель</small><b id="sNum">№1</b><em id="sOf">из 6</em></div>
      <div class="who">
        <h2 id="cName">—</h2>
        <p class="addr" id="cAddr">—</p>
        <p class="meta" id="cMeta">—</p>
      </div>
      <div class="neigh"><span class="k">Соседи</span><div class="nchips" id="cNeigh"></div></div>
      <div class="actions">
        <button class="btn primary" id="cStory">В сторис</button>
        <button class="btn ghost" id="cOrbit">Облететь дом</button>
      </div>
    </div>
  </section>

  <section class="card glass" id="places" hidden>
    <div class="strip"><span>Места города</span><small>школы · вузы · ТЦ</small><button class="x" id="pClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="card-body"><div class="plist" id="pList"></div></div>
  </section>

  <section class="card glass" id="studio" hidden>
    <div class="strip"><span>Съёмка</span><small>для роликов</small><button class="x" id="sClose" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="card-body">
      <div class="field">
        <div class="row"><label for="tRange">Время в городе</label><output id="tOut">--:--</output></div>
        <input type="range" id="tRange" min="0" max="23.99" step="0.05">
        <div class="seg" id="tPresets">
          <button data-h="live" aria-pressed="true">Живое</button>
          <button data-h="8.6" aria-pressed="false">Утро</button>
          <button data-h="12.5" aria-pressed="false">День</button>
          <button data-h="17.2" aria-pressed="false">Закат</button>
          <button data-h="19.1" aria-pressed="false">Вечер</button>
          <button data-h="23" aria-pressed="false">Ночь</button>
        </div>
      </div>
      <label class="tg" for="tgLabels">Ники над домами<input type="checkbox" id="tgLabels" checked></label>
      <label class="tg" for="tgHQ">Максимальное качество<input type="checkbox" id="tgHQ"></label>
      <button class="btn primary" id="sCinema">Облёт города</button>
    </div>
  </section>

  <form class="dock glass" id="searchForm" autocomplete="off" role="search">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Найди свой дом по нику" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="go" type="submit" aria-label="Найти"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </label>
    <span class="sep"></span>
    <button class="dbtn" id="homeBtn" type="button" aria-label="К ёлке"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.5l4.5 6.5h-2.6l3.6 5.5h-3.2l3.2 5H6.5l3.2-5H6.5L10.1 9H7.5z"/><path d="M12 19.5v2"/></svg></button>
    <button class="dbtn" id="placesBtn" type="button" aria-label="Школы, университеты и торговые центры"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 20.5h18"/><path d="M4.5 20.5V10L12 5l7.5 5v10.5"/><path d="M12 5V2.5l3 1.2-3 1.2"/><path d="M10 20.5v-5h4v5"/><path d="M8 11.5h.01M12 11.5h.01M16 11.5h.01"/></svg></button>
    <button class="dbtn" id="cineBtn" type="button" aria-label="Облёт города"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2.5"/><path d="M16 11l5-3v8l-5-3z"/></svg></button>
    <button class="dbtn" id="studioBtn" type="button" aria-label="Съёмка и время"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></button>
  </form>
</div>

<button class="exitc glass" id="exitCine" aria-label="Выйти из облёта"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>

<div class="modal" id="storyModal" hidden>
  <div class="modal-in">
    <img id="storyImg" alt="Картинка для сторис">
    <p>Зажми картинку и сохрани её, потом выкладывай в сторис.</p>
    <button class="btn primary" id="storyDone" style="width:100%">Готово</button>
  </div>
</div>

<div class="loading" id="loading"><h2>Снежный город</h2><p id="loadingTxt">Зажигаем огни…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(() => {
'use strict';
/* ============================== настройки ============================== */
const CITY_NAME = 'Снежный город';
const DAY_SECONDS = 720;          // полные сутки в городе = 12 минут
const DAY_OFFSET_H = 18.6;        // сдвиг городских часов
const P = 38, HALF_BLOCK = 15;    // шаг квартала и половина квартала
const SPECIAL = { '0,0':'plaza', '1,0':'rink', '-1,0':'fair' };
const UNLOCKS = [
  { key:'rink',    name:'Каток',            at:25,   block:[1,0] },
  { key:'fair',    name:'Ёлочная ярмарка',  at:100,  block:[-1,0] },
];
// школы, университеты и торговые центры: отдельные кварталы по всему городу
const LM_STEP = 7;
const LM_KINDS = ['school', 'mall', 'school', 'university'];
const LM_TITLE = { school:'Школы', university:'Университеты', mall:'Торговые центры' };

/* ============================== раскладка ============================== */
const blockCache = [], lmSlots = [], lmCount = {};
function blockOrder(nBlocks){
  for (let r = blockCache.length ? blockCache.lastRing + 1 : 1; blockCache.length < nBlocks; r++){
    const ring = [];
    for (let x=-r; x<=r; x++) for (let z=-r; z<=r; z++){
      if (Math.max(Math.abs(x),Math.abs(z)) !== r || SPECIAL[x+','+z]) continue;
      ring.push([x,z,r]);
    }
    ring.sort((p,q) => (Math.hypot(p[0],p[1]) - Math.hypot(q[0],q[1])) || (Math.atan2(p[1],p[0]) - Math.atan2(q[1],q[0])));
    for (const b of ring){
      if (!isLmBlock(b[0], b[1])){ blockCache.push(b); continue; }
      const k = lmSlots.length, kind = LM_KINDS[k % LM_KINDS.length], num = lmCount[kind] = (lmCount[kind] || 0) + 1;
      lmSlots.push({ bx:b[0], bz:b[1], r, k, kind, num, name: lmName(kind, num), at: Math.max(100, Math.ceil(blockCache.length*6/100)*100) });
    }
    blockCache.lastRing = r;
  }
  return blockCache;
}
function lotsOfBlock(bx,bz){
  const cx = bx*P, cz = bz*P, lots = [];
  for (const row of [1,-1]) for (let col=0; col<3; col++){
    lots.push({ bx, bz, x: cx + (col-1)*10, z: cz + row*7, facing: row,
      road: row>0 ? bz : bz-1, side: row>0 ? 'S' : 'N', xi: bx*3 + col - 1 });
  }
  lots.sort((p,q) => Math.hypot(p.x,p.z) - Math.hypot(q.x,q.z));
  return lots;
}
function streetName(road, xi){
  const half = xi >= 0 ? 0 : 1;
  const idx = (road >= 0 ? 2*road : -2*road - 1)*2 + half;
  const base = STREETS[idx % STREETS.length];
  const k = Math.floor(idx / STREETS.length);
  return (k ? (k+1) + '-я ' : '') + base + ' улица';
}
function houseNumber(lot){
  const k = lot.xi >= 0 ? lot.xi : -lot.xi - 1;
  return 2*k + (lot.side === 'S' ? 1 : 2);
}

let composer = null, bloom = null, hdr = false;
function setupComposer(){
  try{
    const gl2 = renderer.capabilities.isWebGL2;
    const ext = n => { try { return renderer.extensions.has(n); } catch(e){ return false; } };
    const full = gl2 && ext('EXT_color_buffer_float');
    hdr = full || (gl2 && ext('EXT_color_buffer_half_float'));
    const params = { format: THREE.RGBAFormat, type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType };
    const dpr = renderer.getPixelRatio();
    const w = Math.floor(innerWidth*dpr), h = Math.floor(innerHeight*dpr);
    const rt = full ? new THREE.WebGLMultisampleRenderTarget(w, h, params) : new THREE.WebGLRenderTarget(w, h, params);
    if (full) rt.samples = 4;
    composer = new THREE.EffectComposer(renderer, rt);
    composer.setPixelRatio(dpr);
    composer.setSize(innerWidth, innerHeight);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.8, 0.5, hdr ? 1.0 : 0.82);
    composer.addPass(bloom);
  } catch(e){ console.warn('bloom off', e); composer = null; }
}

function boardCanvas(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); draw(x, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function roundRect(x, X, Y, W, H, R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function fitText(x, text, maxW, size, weight, family){
  let s = size; do { x.font = `${weight} ${s}px ${family}`; s -= 2; } while (x.measureText(text).width > maxW && s > 10);
}
function makeSign(title, sub, pos, rotY){
  const g = new THREE.Group();
  const tex = boardCanvas(512, 224, (x,w,h) => {
    roundRect(x, 6, 6, w-12, h-12, 26); x.fillStyle = '#fff6e8'; x.fill(); x.lineWidth = 10; x.strokeStyle = '#2a1a14'; x.stroke();
    x.fillStyle = '#d8352f'; x.fillRect(30, 26, w-60, 10);
    x.fillStyle = '#d8352f'; x.textAlign = 'center'; x.textBaseline = 'middle';
    fitText(x, title, w-70, 70, 400, 'Lobster, Georgia, serif'); x.fillText(title, w/2, sub ? 96 : 118);
    if (sub){ x.fillStyle = '#3a3550'; fitText(x, sub, w-70, 32, 800, 'Manrope, Arial, sans-serif'); x.fillText(sub, w/2, 166); }
  });
  const m = new THREE.MeshBasicMaterial({ map: tex }); dayLitMats.push(m);
  const board = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 2.8), m); board.position.y = 3.6;
  const back = new THREE.Mesh(new THREE.BoxGeometry(6.6, 3.0, 0.22), MAT.wood); back.position.set(0, 3.6, -0.13);
  const p1 = new THREE.Mesh(GEO.box, MAT.wood); p1.scale.set(0.28, 3.6, 0.28); p1.position.set(-2.6, 0, -0.2);
  const p2 = p1.clone(); p2.position.x = 2.6;
  [back,p1,p2].forEach(o => o.castShadow = true);

}

const city = new THREE.Group(); scene.add(city);
let houses = [], total = 0, R = 1, cityHalf = 60, neighborMap = new Map(), landmarks = [], goals = [];
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3(), tmpC = new THREE.Color();
const Q0 = new THREE.Quaternion(), Q90 = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), Math.PI/2);

// «вид» на общую геометрию: те же буферы на видеокарте, но своя граница участка — по ней three.js отсекает невидимое
function geoView(geo, items){
  let x0 = Infinity, y0 = Infinity, z0 = Infinity, x1 = -Infinity, y1 = -Infinity, z1 = -Infinity, pad = 0;
  for (const it of items){ const [x,y,z] = it.p; if (x<x0) x0=x; if (x>x1) x1=x; if (y<y0) y0=y; if (y>y1) y1=y; if (z<z0) z0=z; if (z>z1) z1=z; pad = Math.max(pad, it.s[0], it.s[1], it.s[2]); }
  const g = new THREE.BufferGeometry();
  for (const k in geo.attributes) g.setAttribute(k, geo.attributes[k]);
  if (geo.index) g.setIndex(geo.index);
  g.boundingBox = geo.boundingBox;
  const c = new THREE.Vector3((x0+x1)/2, (y0+y1)/2, (z0+z1)/2);
  g.boundingSphere = new THREE.Sphere(c, Math.hypot(x1-x0, y1-y0, z1-z0)/2 + pad*2.5 + 1);
  g.userData.view = true;
  return g;
}
function instanced(geo, mat, items, opts = {}, parent = city){
  if (!items.length) return null;
  const m = new THREE.InstancedMesh(geoView(geo, items), mat, items.length);
  items.forEach((it, i) => {
    tmpP.set(it.p[0], it.p[1], it.p[2]); tmpS.set(it.s[0], it.s[1], it.s[2]);
    tmpM.compose(tmpP, it.q || Q0, tmpS); m.setMatrixAt(i, tmpM);
    if (it.c !== undefined){ if (Array.isArray(it.c)) tmpC.setRGB(it.c[0],it.c[1],it.c[2]); else tmpC.set(it.c); m.setColorAt(i, tmpC); }
  });
  m.instanceMatrix.needsUpdate = true;
  if (m.instanceColor) m.instanceColor.needsUpdate = true;
  m.castShadow = !!opts.cast; m.receiveShadow = !!opts.receive;
  if (opts.pick){ m.userData.owners = items.map(i => i.o); pickMeshes.push(m); }
  parent.add(m); return m;
}
function pointsFrom(arr, mat, attrs, parent = city){
  if (!arr.pos.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(arr.pos, 3));
  for (const [k, size] of attrs) g.setAttribute(k, new THREE.Float32BufferAttribute(arr[k], size));
  g.computeBoundingSphere(); g.boundingSphere.radius += 2;
  const p = new THREE.Points(g, mat); parent.add(p); return p;
}

/* ---------- участки: дальние рисуются крупно, ближние — со всеми деталями ---------- */
const NEAR_D = isCoarse ? 95 : 135, MID_D = isCoarse ? 220 : 290, GLOW_D = isCoarse ? 420 : 680;
const DETAIL_CHUNK = 5*P, FAR_CHUNK = 10*P;
let chunkList = [], chunkMap = new Map(), pickMeshes = [];
function chunkGroup(tier, size, x, z){
  const cx = Math.floor(x/size), cz = Math.floor(z/size), key = tier + '|' + size + '|' + cx + ',' + cz;
  let c = chunkMap.get(key);
  if (!c){
    c = { tier, group: new THREE.Group(), center: new THREE.Vector3((cx+0.5)*size, 0, (cz+0.5)*size), radius: size*0.72 + 12 };
    chunkMap.set(key, c); chunkList.push(c); city.add(c.group);
  }
  return c.group;
}
// крупные участки — для того, что видно издалека; мелкие — для деталей рядом
const BIG_TIERS = new Set(['far', 'glow', 'tree', 'lo']);
function chunked(geo, mat, items, opts, tier){
  const size = BIG_TIERS.has(tier) ? FAR_CHUNK : DETAIL_CHUNK, by = new Map();
  for (const it of items){ const g = chunkGroup(tier, size, it.p[0], it.p[2]); let l = by.get(g); if (!l) by.set(g, l = []); l.push(it); }
  for (const [g, l] of by) instanced(geo, mat, l, opts, g);
}
function chunkedPoints(arr, mat, attrs, tier){
  const by = new Map(), n = arr.pos.length/3;
  for (let i = 0; i < n; i++){
    const g = chunkGroup(tier, BIG_TIERS.has(tier) ? FAR_CHUNK : DETAIL_CHUNK, arr.pos[i*3], arr.pos[i*3+2]);
    let b = by.get(g); if (!b){ b = { pos:[] }; for (const [k] of attrs) b[k] = []; by.set(g, b); }
    b.pos.push(arr.pos[i*3], arr.pos[i*3+1], arr.pos[i*3+2]);
    for (const [k, size] of attrs) for (let j = 0; j < size; j++) b[k].push(arr[k][i*size + j]);
  }
  for (const [g, b] of by) pointsFrom(b, mat, attrs, g);
}
// крупные части (стены, большие крыши, башни) видны издалека, мелочь — только рядом
const bigSplit = (items, vol = 3.5) => { const big = [], small = []; for (const it of items) (it.s[0]*it.s[1]*it.s[2] >= vol ? big : small).push(it); return [big, small]; };
function updateChunks(){
  const cp = camera.position;
  for (const c of chunkList){
    if (c.tier === 'far') continue;
    const d = cp.distanceTo(c.center) - c.radius;
    c.group.visible = c.tier === 'near' ? d < NEAR_D : (c.tier === 'mid' || c.tier === 'tree') ? d < MID_D : c.tier === 'glow' ? d < GLOW_D : d >= MID_D;
  }
}

function buildCity(list){
  // очистка
  for (const o of [...city.children]){ city.remove(o); o.traverse(n => { if (n.geometry && !n.geometry.userData.view && !Object.values(GEO).includes(n.geometry)) n.geometry.dispose(); if (n.isInstancedMesh) n.dispose?.(); }); }
  dayLitMats.length = 0; glowMats.length = 0; spinners.length = 0;
  chunkList = []; chunkMap = new Map(); pickMeshes = []; shopSigns = [];
  houses = []; neighborMap = new Map();
  const active = list.filter(f => !f.left);
  total = active.length;
  const N = list.length;
  const nBlocks = Math.max(1, Math.ceil(N/6));
  const order = blockOrder(nBlocks);
  while (!lmSlots.some(s => s.at > total)) blockOrder(blockCache.length + 1);
  const used = order.slice(0, nBlocks);
  R = Math.max(2, ...used.map(b => b[2]));
  // места: все, что внутри города, плюс ближайшая стройка (город немного дорастает до неё)
  const nextLm = lmSlots.find(s => s.at > total);
  landmarks = lmSlots.filter(s => s.r <= R || s === nextLm);
  if (nextLm) R = Math.max(R, nextLm.r);
  const lmKeys = new Set(landmarks.map(s => s.bx + ',' + s.bz));
  goals = [...UNLOCKS, ...landmarks.map(s => ({ key:s.kind, name:s.name, at:s.at, block:[s.bx, s.bz] }))].sort((a, b) => a.at - b.at);
  cityHalf = (R + 0.5)*P;

  const A = { body:[], roof:[], snow:[], cap:[], door:[], chim:[], win:[], tree:[], bank:[], pole:[], bulb:[], pool:[], path:[],
              cyl:[], cone:[], torus:[], htorus:[], colm:[], gold:[], awn:{}, sph:[], frus:[], board:[] };
  const gar = { pos:[], aColor:[], aPhase:[], aSize:[] };
  const smk = { pos:[], aPhase:[] };
  const gr = rng(4242);
  const addLight = (x,y,z,col,size,phase) => { gar.pos.push(x,y,z); gar.aColor.push(col[0],col[1],col[2]); gar.aPhase.push(phase ?? gr()); gar.aSize.push(size); };
  const addLamp = (x,z,h=4.6) => {
    A.pole.push({ p:[x,0,z], s:[1,h,1] });
    A.bulb.push({ p:[x,h+0.15,z], s:[0.34,0.34,0.34] });
    A.pool.push({ p:[x,0.07,z], s:[12,1,12] });
  };
  const addTree = (x,z,s) => A.tree.push({ p:[x,0,z], s:[s,s*(0.9+gr()*0.25),s], q: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), gr()*6.28), c:[0.9+gr()*0.15,0.9+gr()*0.15,0.9+gr()*0.15] });

  // ---- кварталы ----
  const allBlocks = [];
  for (let bx=-R; bx<=R; bx++) for (let bz=-R; bz<=R; bz++) allBlocks.push([bx,bz]);
  const lotsTaken = new Map();
  let idx = 0;
  for (const [bx,bz] of used){
    for (const lot of lotsOfBlock(bx,bz)){
      if (idx >= N) break;
      lotsTaken.set(`${lot.x},${lot.z}`, true);
      const f = list[idx++];
      const hh = makeHouse(f, lot); hh.idx = houses.length; houses.push(hh);
    }
  }
  for (const [bx,bz] of allBlocks){
    const cx = bx*P, cz = bz*P, key = bx+','+bz, sp = SPECIAL[key] || (lmKeys.has(key) ? 'lm' : null);
    // сугробы по краям квартала (с проходами к домам)
    const gapsX = sp ? [0] : [-10,0,10];
    for (const s of [1,-1]){
      segs(-HALF_BLOCK+0.6, HALF_BLOCK-0.6, gapsX, 1.5).forEach(([a,b]) => A.bank.push({ p:[cx+(a+b)/2, 0, cz+s*(HALF_BLOCK+0.3)], s:[b-a, 0.5, 0.85] }));
      segs(-HALF_BLOCK+0.6, HALF_BLOCK-0.6, sp ? [0] : [], 1.5).forEach(([a,b]) => A.bank.push({ p:[cx+s*(HALF_BLOCK+0.3), 0, cz+(a+b)/2], s:[b-a, 0.5, 0.85], q:Q90 }));
    }
    if (!sp){
      for (const s of [1,-1]) for (const ox of [-5,5]) addLamp(cx+ox, cz+s*(HALF_BLOCK+0.4));
      for (const lot of lotsOfBlock(bx,bz)){
        if (lotsTaken.has(`${lot.x},${lot.z}`)) continue;
        const k = 1 + Math.floor(gr()*2.4);
        for (let i=0;i<k;i++) addTree(lot.x + (gr()-0.5)*7, lot.z + (gr()-0.5)*8, 0.8 + gr()*0.5);
      }
    }
  }
  // ---- дома ----
  A_boardList = A.board;
  for (const h of houses) emitHouse(h, A, gar, smk, addTree);
  A_boardList = null;
  // ---- соседи ----
  for (const h of houses) neighborMap.set(`${h.lot.road}|${h.lot.side}|${h.lot.xi}`, h);

  // ---- особые места ----
  buildPlaza(A, addLight, addLamp, addTree);
  buildRink(total >= 25, A, addLight, addLamp, addTree);
  buildFair(total >= 100, A, addLight, addLamp, addTree);
  buildLandmarks(A, gar, addLamp, addTree);

  // ---- лес вокруг ----
  const rIn = cityHalf + 8, nForest = 260 + R*90;
  for (let i=0;i<nForest;i++){
    const a = gr()*Math.PI*2, d = rIn + Math.pow(gr(), 0.8)*(110 + R*10);
    addTree(Math.cos(a)*d, Math.sin(a)*d, 0.9 + gr()*1.1);
  }

  // ---- дороги ----
  const rp = [], ruv = [], ri = [];
  const quad = (x0,z0,x1,z1,u0,u1,vertical,y) => {
    const b = rp.length/3;
    if (!vertical){ rp.push(x0,y,z0, x1,y,z0, x1,y,z1, x0,y,z1); ruv.push(u0,0, u1,0, u1,1, u0,1); }
    else { rp.push(x0,y,z0, x1,y,z0, x1,y,z1, x0,y,z1); ruv.push(u0,0, u0,1, u1,1, u1,0); }
    ri.push(b,b+2,b+1, b,b+3,b+2);
  };
  const ext = cityHalf + 4;
  for (let j=-R-1; j<=R; j++){
    const zc = (j+0.5)*P; quad(-ext, zc-4, ext, zc+4, -ext/8, ext/8, false, 0.03);
    const xc = (j+0.5)*P; quad(xc-4, -ext, xc+4, ext, -ext/8, ext/8, true, 0.035);
  }
  const rg = new THREE.BufferGeometry();
  rg.setAttribute('position', new THREE.Float32BufferAttribute(rp,3));
  rg.setAttribute('uv', new THREE.Float32BufferAttribute(ruv,2));
  rg.setIndex(ri); rg.computeVertexNormals();
  const roads = new THREE.Mesh(rg, MAT.road); roads.receiveShadow = true; city.add(roads);

  // ---- инстансы по участкам ----
  const [bodyFar, bodyNear] = bigSplit(A.body);
  const [capFar, capMid] = bigSplit(A.cap);
  for (const c of capFar) bodyFar.push({ p:c.p, s:c.s, c:0xeef3fb });   // плоские заснеженные крыши — в один слой со стенами
  chunked(GEO.box, MAT.body, bodyFar, { cast:true, receive:true, pick:true }, 'far');
  chunked(GEO.box, MAT.body, bodyNear, { receive:true, pick:true }, 'near');
  chunked(GEO.prism, MAT.roof, A.roof, { cast:true, pick:true }, 'far');
  chunked(GEO.prism, MAT.snow, A.snow, { cast:true, receive:true, pick:true }, 'far');
  chunked(GEO.box, MAT.snow, capMid, {}, 'mid');
  chunked(GEO.cbox, MAT.door, A.door, {}, 'mid');
  chunked(GEO.box, MAT.chim, A.chim, {}, 'mid');
  chunked(GEO.cbox, windowMat, A.win, {}, 'glow');
  chunked(GEO.tree, MAT.tree, A.tree, { cast:true, receive:true }, 'tree');
  chunked(GEO.treeLo, MAT.tree, A.tree, {}, 'lo');
  chunked(GEO.bank, MAT.bank, A.bank, { receive:true }, 'mid');
  chunked(GEO.pole, MAT.pole, A.pole, {}, 'mid');

  }
  // вывеска и серебряный клош на крыше
  const signZ = d/2 - 0.7, signY = h + 0.7 + 1.25;

  for (const lx of [-2.8, 1.6]){ const q = along(lx, 0, signZ - 0.1); A.body.push({ p:[q.x, h + 0.45, q.z], s:[0.2, 0.9, 0.2], c:0x16121c, o }); }
  const pp = along(3.3, 0, -1.4), py = h + 0.7;

  A.sph.push({ p:[pp.x, py + 0.12, pp.z], s:[1.05, 0.95, 1.05], c:0xc9ccd4 });
  A.sph.push({ p:[pp.x, py + 1.12, pp.z], s:[0.16, 0.16, 0.16], c:gold });
  if (!H.left){
    lampLights(gar, x - w/2 - 0.2, x + w/2 + 0.2, h + 0.2, front + f*0.3, 0, LIGHTS_WARM, H.n);
    lampLights(gar, x - w/2 - 0.1, x + w/2 + 0.1, 3.5, front + f*0.18, 0.2, LIGHTS_WARM, H.n + 1);
    for (const s of [-1, 1]){ gar.pos.push(x + s*1.1, 2.95, z + f*(d/2 + 3.1)); gar.aColor.push(1, 0.82, 0.5); gar.aPhase.push(r()); gar.aSize.push(0.5); }

function emitHouse(H, A, gar, smk, addTree){
  if (H.type === 'mansion') return emitMansion(H, A, gar, smk, addTree);
  if (H.type === 'doner') return emitDoner(H, A, gar, smk, addTree);
  if (SHOPS[H.type]) return emitShop(H, A, gar, smk, addTree);
  if (H.type === 'tower') return emitTower(H, A, gar, smk, addTree);
  if (H.type === 'chalet') return emitChalet(H, A, gar, smk, addTree);
  if (H.type === 'gingerbread') return emitGingerbread(H, A, gar, smk, addTree);
  if (H.type === 'izba') return emitIzba(H, A, gar, smk, addTree);
  if (H.type === 'modern') return emitModern(H, A, gar, smk, addTree);
  if (H.type === 'castle') return emitCastle(H, A, gar, smk, addTree);
  if (H.type === 'igloo') return emitIgloo(H, A, gar, smk, addTree);
  if (H.type === 'windmill') return emitWindmill(H, A, gar, smk, addTree);
  if (H.type === 'barn') return emitBarn(H, A, gar, smk, addTree);
  if (H.type === 'ice') return emitIce(H, A, gar, smk, addTree);
  if (H.type === 'white') return emitWhite(H, A, gar, smk, addTree);
  if (H.type === 'canteen') return emitCanteen(H, A, gar, smk, addTree);
  if (H.type === 'restaurant') return emitRestaurant(H, A, gar, smk, addTree);
  return emitBasic(H, A, gar, smk, addTree);
}
function emitBasic(H, A, gar, smk, addTree){
  const { x, z, facing:f, w, d, h, rh } = H;
  const r = rng(H.n*31 + 7);
  A.body.push({ p:[x,0,z], s:[w,h,d], c:H.body, o:H.idx });
  if (!H.ridgeZ){
    A.roof.push({ p:[x,h,z], s:[w+0.8, rh, d+0.9], c:H.roof, o:H.idx });
    if (H.noSnowRoof) A.snow.push({ p:[x,h+rh*0.72,z], s:[w+0.7, rh*0.3, (d+0.9)*0.3], o:H.idx });
    else A.snow.push({ p:[x,h+0.3,z], s:[w+0.55, rh, (d+0.9)*0.98], o:H.idx });
  } else {
    A.roof.push({ p:[x,h,z], s:[d+0.9, rh, w+0.8], q:Q90, c:H.roof, o:H.idx });
    A.snow.push({ p:[x,h+0.3,z], s:[d+0.65, rh, (w+0.8)*0.98], q:Q90, o:H.idx });
  }
  const fz = z + f*(d/2 + 0.03);
  A.door.push({ p:[x, 1.1, fz + f*0.04], s:[1.2, 2.2, 0.14], c:H.door });
  A.bulb.push({ p:[x + 0.95, 2.45, fz + f*0.25], s:[0.16,0.16,0.16] });
  const pathEnd = z + f*8.4;
  A.path.push({ p:[x, 0.045, (fz + pathEnd)/2], s:[1.6, 1, Math.abs(pathEnd - fz)] });
  const win = (wx, wy, wz, sx, sy, sz) => A.win.push({ p:[wx,wy,wz], s:[sx,sy,sz], c:[H.left ? 9 : 0.12 + r()*0.75, r(), r()] });
  win(x - w*0.3, 1.9, fz, 1.25, 1.15, 0.12);
  win(x + w*0.3, 1.9, fz, 1.25, 1.15, 0.12);
  if (H.floors === 2){
    win(x - w*0.28, 4.55, fz, 1.1, 1.1, 0.12);
    win(x, 4.55, fz, 1.1, 1.1, 0.12);
    win(x + w*0.28, 4.55, fz, 1.1, 1.1, 0.12);
  }
  if (H.ridgeZ) win(x, h + rh*0.34, z + f*(d/2 + 0.3), 0.85, 0.85, 0.12);
  for (const s of [-1,1]){
    win(x + s*(w/2 + 0.03), 1.9, z, 0.12, 1.1, 1.2);
    if (H.floors === 2) win(x + s*(w/2 + 0.03), 4.55, z, 0.12, 1.1, 1.2);
  }
  // труба + дым
  if (H.chimney){
    let cx, cz, cy, ch;
    if (!H.ridgeZ){ cx = x + H.chimSide*w*0.25; cz = z - f*d*0.16; cy = h + rh*0.45; ch = rh*0.75 + 0.9; }
    else { cx = x + H.chimSide*w*0.2; cz = z - f*d*0.2; cy = h + rh*0.3; ch = rh*0.75 + 0.9; }
    A.chim.push({ p:[cx, cy, cz], s:[0.75, ch, 0.75] });
    A.cap.push({ p:[cx, cy+ch, cz], s:[0.95, 0.28, 0.95] });
    if (!H.left && smk.pos.length/3 < 1400){ for (let i=0;i<5;i++){ smk.pos.push(cx, cy+ch+0.2, cz); smk.aPhase.push(i/5 + r()*0.1); } }
  }
  // гирлянда
  if (H.garland){
    const pal = H.pal || (H.warm ? LIGHTS_WARM : LIGHTS_MULTI);
    let k = 0;
    if (!H.ridgeZ){
      const gz = z + f*(d/2 + 0.5), L = w + 0.8, n = Math.round(L/0.42);
      for (let i=0;i<=n;i++){ const t = i/n; gar.pos.push(x - L/2 + L*t, h - 0.12 - 0.3*Math.sin(Math.PI*((t*3)%1)), gz); const c = pal[k++ % pal.length]; gar.aColor.push(...c); gar.aPhase.push(r()); gar.aSize.push(0.42); }
    } else {
      const gz = z + f*(d/2 + 0.52), L = w/2 + 0.45;
      const n = Math.round(Math.hypot(L, rh)/0.42);
      for (const s of [-1,1]) for (let i=0;i<n;i++){ const t = i/n; gar.pos.push(x + s*L*(1-t), h + rh*t - 0.05, gz); const c = pal[k++ % pal.length]; gar.aColor.push(...c); gar.aPhase.push(r()); gar.aSize.push(0.42); }
    }
  }
  if (!H.type || H.type === 'big' || H.type === 'ice') basicExtras(H, A, gar, win, fz);
  if (H.backTree) addTree(x + (r()-0.5)*w, z - f*(d/2 + 2.6), 0.6 + r()*0.4);
  if (H.type === 'big'){ addTree(x - w/2 + 0.4, z + f*(d/2 + 2.0), 0.55); addTree(x + w/2 - 0.4, z + f*(d/2 + 2.0), 0.55); A.bulb.push({ p:[x - 0.95, 2.45, fz + f*0.25], s:[0.16,0.16,0.16] }); }
}

  [[-0.25,5.15],[0.25,5.15]].forEach(([ex,ey]) => { const e = new THREE.Mesh(GEO.bulb, MAT.dark); e.scale.setScalar(0.09); e.position.set(ex, ey, 0.66); sm.add(e); });
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(0.85,0.2,6,16).rotateX(Math.PI/2), new THREE.MeshLambertMaterial({ color:0xff8a3d })); scarf.position.y = 4.3; sm.add(scarf);

/* ---------- каток ---------- */
function fencePlot(cx, cz){
  const g = new THREE.Group(), W = 11, D = 9;
  const pts = []; for (let i=-W;i<=W;i+=2.75){ pts.push([i,-D],[i,D]); } for (let j=-D+2.25;j<D;j+=2.25){ pts.push([-W,j],[W,j]); }
  for (const [px,pz] of pts){ const p = new THREE.Mesh(GEO.box, MAT.wood); p.scale.set(0.25,1.3,0.25); p.position.set(cx+px,0,cz+pz); p.castShadow = true; g.add(p); }
  for (const [a,b,c,dd] of [[-W,-D,W,-D],[-W,D,W,D],[-W,-D,-W,D],[W,-D,W,D]]){
    const L = Math.hypot(c-a, dd-b); const rail = new THREE.Mesh(GEO.cbox, MAT.wood); rail.scale.set(L, 0.14, 0.14); rail.position.set(cx+(a+c)/2, 1.0, cz+(b+dd)/2); if (a===c) rail.rotation.y = Math.PI/2; g.add(rail);
  }
  city.add(g);
}
function buildRink(open, A, addLight, addLamp, addTree){
  const cx = P, cz = 0;
  if (!open){
    fencePlot(cx, cz);
    city.add(makeSign('Каток', 'откроется на 25 жителях', new THREE.Vector3(cx, 0, cz + 9.6), 0));
    for (const [tx,tz] of [[-6,-4],[5,3],[7,-5]]) addTree(cx+tx, cz+tz, 0.7);
    return;
  }
  const ice = new THREE.Mesh(new THREE.CircleGeometry(1, 64).rotateX(-Math.PI/2), MAT.ice); ice.scale.set(11.2, 1, 8.4); ice.position.set(cx, 0.06, cz); ice.receiveShadow = true; city.add(ice);
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 6, 64).rotateX(Math.PI/2), MAT.white); rim.scale.set(11.6, 8.8, 8); rim.position.set(cx, 0.12, cz); city.add(rim);
  const posts = 14;
  for (let i=0;i<posts;i++){
    const a = i/posts*Math.PI*2, px = cx + Math.cos(a)*12.6, pz = cz + Math.sin(a)*9.6;
    A.pole.push({ p:[px,0,pz], s:[0.8,2.8,0.8] });
    const a2 = (i+1)/posts*Math.PI*2, qx = cx + Math.cos(a2)*12.6, qz = cz + Math.sin(a2)*9.6;
    for (let j=0;j<10;j++){ const t = j/10; addLight(px+(qx-px)*t, 2.75 - Math.sin(Math.PI*t)*0.45, pz+(qz-pz)*t, LIGHTS_MULTI[(i+j)%5], 0.5); }
  }
  addLamp(cx-13.6, cz-11.4); addLamp(cx+13.6, cz+11.4);
  city.add(makeSign('Каток', '', new THREE.Vector3(cx-9, 0, cz + 12.2), 0.15));
}

/* ---------- ярмарка ---------- */
function buildFair(open, A, addLight, addLamp, addTree){
  const cx = -P, cz = 0;
  if (!open){
    fencePlot(cx, cz);
    city.add(makeSign('Ярмарка', 'откроется на 100 жителях', new THREE.Vector3(cx, 0, cz + 9.6), 0));
    for (const [tx,tz] of [[-6,-3],[6,-4],[-2,4]]) addTree(cx+tx, cz+tz, 0.7);
    return;
  }
  const stripe = boardCanvas(128, 32, (x) => { for (let i=0;i<8;i++){ x.fillStyle = i%2 ? '#fff4e6' : '#d9443f'; x.fillRect(i*16,0,16,32); } });
  stripe.wrapS = THREE.RepeatWrapping;
  const roofM = new THREE.MeshLambertMaterial({ map: stripe });
  for (let i=0;i<5;i++){
    const a = Math.PI*0.15 + i/4*Math.PI*0.7, px = cx + Math.cos(a)*9, pz = cz - Math.sin(a)*7 + 1.5;
    const g = new THREE.Group();
    const body = new THREE.Mesh(GEO.box, MAT.wood); body.scale.set(3.4, 2.4, 2.4); body.castShadow = true;
    const roof = new THREE.Mesh(GEO.prism, roofM); roof.scale.set(4.0, 1.3, 3.2); roof.position.y = 2.4; roof.castShadow = true;
    const cap = new THREE.Mesh(GEO.prism, MAT.snow); cap.scale.set(3.8, 1.3, 3.0); cap.position.y = 2.62;

    const zx = Math.sin(th), zz = Math.cos(th), xx = Math.cos(th), xz = -Math.sin(th);

  addTree(cx, cz + 3, 1.2);

}

const SIGN_POOL = isCoarse ? 14 : 22;
const signs = [];
for (let i=0;i<SIGN_POOL;i++){
  const c = document.createElement('canvas'); c.width = 320; c.height = 72;
  const tex = new THREE.CanvasTexture(c); tex.anisotropy = 4;
  const mat = new THREE.MeshBasicMaterial({ map: tex });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat); mesh.visible = false;
  scene.add(mesh); signs.push({ c, tex, mat, mesh, house:null });
}
function drawSign(s, h){
  const x = s.c.getContext('2d'), W = s.c.width, Hh = s.c.height;
  x.clearRect(0,0,W,Hh);
  roundRect(x, 3, 3, W-6, Hh-6, 14); x.fillStyle = '#fff6e8'; x.fill(); x.lineWidth = 5; x.strokeStyle = '#2a1a14'; x.stroke();
  const t = h.left ? 'свободно' : (h.name || '№' + h.n);
  x.fillStyle = h.name ? '#1b2142' : '#6a6f90'; x.textAlign = 'center'; x.textBaseline = 'middle';
  fitText(x, t, W-30, 38, 800, 'Manrope, Arial, sans-serif'); x.fillText(t, W/2, Hh/2 + 2);
  s.tex.needsUpdate = true;
}
function resetSigns(){ signs.forEach(s => { s.house = null; s.mesh.visible = false; }); }
function placeSign(s, h){
  s.house = h; drawSign(s, h);
  const sw = h.signW ?? Math.min(h.w*0.58, 4.2);
  s.mesh.scale.set(sw, sw*72/320, 1);
  s.mesh.position.set(h.x, h.signY, h.signZ ?? (h.z + h.facing*(h.d/2 + 0.06)));
  s.mesh.rotation.set(0, h.facing > 0 ? 0 : Math.PI, 0);
  s.mesh.visible = true;
}
function updateSigns(){
  const cp = camera.position, LIM = 75*75;
  const near = [];
  for (const h of houses){ if (h.noFacadeSign) continue; const dx = h.x-cp.x, dz = h.z-cp.z, dy = h.h - cp.y; const d2 = dx*dx+dz*dz+dy*dy; if (d2 < LIM) near.push([d2,h]); }
  near.sort((a,b) => a[0]-b[0]);
  const want = new Set(near.slice(0, SIGN_POOL).map(v => v[1]));
  const free = [];
  for (const s of signs){ if (s.house && want.has(s.house)) want.delete(s.house); else free.push(s); }
  for (const s of free){ const h = want.values().next().value; if (h){ want.delete(h); placeSign(s, h); } else { s.house = null; s.mesh.visible = false; } }
}

/* ============================== подписи над домами ============================== */
const LABEL_POOL = isCoarse ? 26 : 42;
const labelsEl = $('labels');
const labels = [];
for (let i=0;i<LABEL_POOL;i++){
  const el = document.createElement('div'); el.className = 'lbl'; labelsEl.appendChild(el);
  el.addEventListener('click', () => { if (el._h) selectHouse(el._h, true); });
  labels.push({ el, house:null, x:0, y:0, o:0 });
}
let showLabels = true, selected = null;
const proj = new THREE.Vector3();
function labelText(h){ return h.left ? 'свободный дом' : (h.name || 'житель №' + h.n); }
function screenOf(h, y){ proj.set(h.x, y ?? h.top, h.z).project(camera); return { x:(proj.x*0.5+0.5)*innerWidth, y:(-proj.y*0.5+0.5)*innerHeight, ok: proj.z < 1 && Math.abs(proj.x) < 1.15 && Math.abs(proj.y) < 1.15 }; }
function pickLabels(){
  const cp = camera.position, camD = camera.position.distanceTo(controls.target);
  const LD = clamp(camD*1.55, 45, 150);
  const cand = [];
  for (const h of houses){ const dx = h.x-cp.x, dz = h.z-cp.z, dy = h.top-cp.y; const d = Math.sqrt(dx*dx+dy*dy+dz*dz); if (d < LD || h === selected) cand.push([h === selected ? -1 : d, h]); }
  cand.sort((a,b) => a[0]-b[0]);
  const rects = [], chosen = [];
  for (const [d,h] of cand){
    if (chosen.length >= LABEL_POOL) break;
    const s = screenOf(h); if (!s.ok) continue;
    const w = labelText(h).length*7.6 + 34, hh = 30;
    const rect = [s.x - w/2, s.y - hh - 8, s.x + w/2, s.y - 8];
    if (h !== selected && rects.some(q => rect[0] < q[2] && rect[2] > q[0] && rect[1] < q[3] && rect[3] > q[1])) continue;
    rects.push(rect); chosen.push([h, d < 0 ? 0 : d, LD]);
  }
  const keep = new Map(chosen.map(c => [c[0], c]));
  const free = [];
  for (const L of labels){ if (L.house && keep.has(L.house)){ L.fade = keep.get(L.house); keep.delete(L.house); } else free.push(L); }
  for (const L of free){
    const it = keep.values().next().value;
    if (it){ keep.delete(it[0]); setLabel(L, it[0]); L.fade = it; }
    else { L.house = null; L.el._h = null; L.fade = null; }
  }
}
function setLabel(L, h){
  L.house = h; L.el._h = h; L.el.textContent = labelText(h);
  L.el.classList.toggle('anon', !h.name || h.left);
  L.el.classList.toggle('sel', h === selected);
}
function updateLabels(){
  for (const L of labels){
    const want = showLabels && L.house && L.fade ? (L.house === selected ? 1 : 1 - smooth(L.fade[2]*0.62, L.fade[2], L.fade[1])) : 0;
    L.o += (want - L.o)*0.25;
    if (L.o < 0.01 && !L.house){ if (L.el.style.opacity !== '0') L.el.style.opacity = '0'; continue; }
    if (!L.house){ L.el.style.opacity = L.o.toFixed(2); L.el.style.pointerEvents = 'none'; continue; }
    const s = screenOf(L.house);
    if (!s.ok){ L.el.style.opacity = '0'; continue; }
    L.el.style.transform = `translate3d(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px, 0) translate(-50%, calc(-100% - 11px))`;
    L.el.style.opacity = L.o.toFixed(2);
    L.el.style.pointerEvents = L.o > 0.4 ? 'auto' : 'none';
  }
}

let fly = null, cine = null;
function homeView(){
  const small = houses.length <= 6;
  const d = small ? 66 : 58 + R*22;
  const target = new THREE.Vector3(0, 3, small ? -15 : -8);
  const pos = target.clone().add(new THREE.Vector3(0.62, 0.62, 0.48).normalize().multiplyScalar(d));
  return { pos, target };
}
const ease = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
function flyTo(pos, target, dur = 1.7, arc){
  cine = null; document.body.classList.remove('cinema');
  if (reduceMotion) dur = 0.01;
  fly = { t:0, dur, p0:camera.position.clone(), t0:controls.target.clone(), p1:pos.clone(), t1:target.clone(),
          arc: arc ?? clamp(camera.position.distanceTo(pos)*0.18, 0, 40) };
  controls.enabled = false;
}
function houseView(h){
  const target = new THREE.Vector3(h.x, h.h*0.55, h.z);
  const pos = new THREE.Vector3(h.x + 9, h.h + 9, h.z + h.facing*24);
  return { pos, target };
}
function startCinema(house){
  closeSheets(!!house);
  cine = { house, a: house ? Math.atan2(camera.position.x - house.x, camera.position.z - house.z) : Math.atan2(camera.position.x, camera.position.z), t:0 };
  fly = null; controls.enabled = false; document.body.classList.add('cinema');
}
function stopCinema(){

}
const camLook = new THREE.Vector3();
function updateCamera(dt){
  if (fly){
    fly.t += dt; const k = ease(clamp(fly.t/fly.dur, 0, 1));

    camLook.lerpVectors(fly.t0, fly.t1, k); camera.lookAt(camLook);
    if (fly.t >= fly.dur){ controls.target.copy(fly.t1); fly = null; controls.enabled = true; controls.update(); }
    return;
  }
  if (cine){
    cine.t += dt;
    if (cine.house){
      const h = cine.house; cine.a += dt*0.22;
      const cr = 15 + Math.max(h.w, h.d, h.top)*0.85;
      camLook.set(h.x, h.top*0.42, h.z);
      camera.position.set(h.x + Math.sin(cine.a)*cr, h.top*0.55 + 5 + Math.sin(cine.t*0.4)*2, h.z + Math.cos(cine.a)*cr);
    } else {
      cine.a += dt*0.05;

      camLook.set(Math.sin(cine.a*0.7)*cityHalf*0.15, 4, Math.cos(cine.a*0.5)*cityHalf*0.15);
      camera.position.set(Math.sin(cine.a)*rad, 26 + cityHalf*0.22 + Math.sin(cine.t*0.15)*8, Math.cos(cine.a)*rad);

  const cx = clamp(tg.x, -lim, lim) - tg.x, cz = clamp(tg.z, -lim, lim) - tg.z;

}

// отдельный кадр 1080×1920: вечер, ракурс 3/4 на фасад, дом в центре
const STORY_FOV = 52;
function storyShot(h){
  // камера над дорогой перед домом, чуть сбоку и сверху — чтобы не упереться в дом напротив
  const size = Math.max(h.w, h.d, h.top);
  const Dh = 11 + size*1.05;
  const side = (h.n % 2 ? 1 : -1)*0.48;
  const dx = Math.sin(side), dz = h.facing*Math.cos(side);
  return { pos: new THREE.Vector3(h.x + dx*Dh, h.top*0.5 + Dh*0.5, h.z + dz*Dh), target: new THREE.Vector3(h.x, h.top*0.36, h.z) };
}
function makeStory(h){
  const W = 1080, HH = 1920;

  let img = null;
  try{
    const shot = storyShot(h);
    camera.position.copy(shot.pos); camLook.copy(shot.target); camera.lookAt(camLook);
    camera.fov = STORY_FOV; camera.aspect = W/HH; camera.setViewOffset(W, HH, 0, HH*0.07, W, HH); camera.updateProjectionMatrix();
    renderer.setPixelRatio(1); renderer.setSize(W, HH, false);
    if (composer){ composer.setPixelRatio(1); composer.setSize(W, HH); }
    const sc = scaleUniform(); pointMats.forEach(m => m.uniforms.uScale.value = sc);
    stars.material.uniforms.uPx.value = 1;
    if (selRing) selRing.visible = false;
    applyTime(20.7, clockT);
    sky.position.copy(camera.position); stars.position.copy(camera.position);
    aurora.group.position.set(camera.position.x, 0, camera.position.z);
    moon.position.copy(camera.position).addScaledVector(moonDir, 2000);
    snow.material.uniforms.uCenter.value.set(camLook.x, 50, camLook.z);
    dir.position.copy(camLook).addScaledVector(lightDir, 200); dir.target.position.copy(camLook); dir.target.updateMatrixWorld();
    updateSigns();
    renderFrame(); renderFrame();
    img = document.createElement('canvas'); img.width = W; img.height = HH;
    img.getContext('2d').drawImage(renderer.domElement, 0, 0, W, HH);
  } finally {
    camera.fov = saved.fov; camera.clearViewOffset();
    camera.position.copy(saved.pos); camera.quaternion.copy(saved.q); camLook.copy(saved.look);
    renderer.setPixelRatio(saved.dpr); onResize();
    if (selRing) selRing.visible = saved.ring;
    updateSigns();
  }
  const out = document.createElement('canvas'); out.width = W; out.height = HH; const x = out.getContext('2d');
  x.drawImage(img, 0, 0);
  // затемнение сверху и снизу, лёгкая виньетка
  let g = x.createLinearGradient(0,0,0,520); g.addColorStop(0,'rgba(8,12,36,.85)'); g.addColorStop(1,'rgba(8,12,36,0)'); x.fillStyle = g; x.fillRect(0,0,W,520);
  g = x.createLinearGradient(0,1180,0,HH); g.addColorStop(0,'rgba(8,12,36,0)'); g.addColorStop(1,'rgba(8,12,36,.75)'); x.fillStyle = g; x.fillRect(0,1180,W,HH-1180);
  g = x.createRadialGradient(W/2, HH*0.45, HH*0.3, W/2, HH*0.45, HH*0.8); g.addColorStop(0,'rgba(8,12,36,0)'); g.addColorStop(1,'rgba(8,12,36,.45)'); x.fillStyle = g; x.fillRect(0,0,W,HH);
  // шапка
  x.textBaseline = 'top'; x.textAlign = 'left';
  x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 24;
  x.fillStyle = '#ff6a5f'; x.font = '400 112px Lobster, Georgia, serif'; x.fillText(CITY_NAME, 72, 96);
  x.fillStyle = '#e9eefc'; x.font = '700 42px Manrope, Arial, sans-serif'; x.fillText('каждый подписчик — свой дом', 76, 236);
  x.shadowBlur = 0;
  // карточка «Прописка»
  const cy = 1330, ch = 500;
  x.save(); x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 40; roundRect(x, 60, cy, 960, ch, 44); x.fillStyle = 'rgba(247,250,255,.97)'; x.fill(); x.restore();
  x.save(); roundRect(x, 60, cy, 960, ch, 44); x.clip(); x.fillStyle = '#d8352f'; x.fillRect(60, cy, 960, 96); x.restore();
  x.fillStyle = '#fff'; x.font = '400 58px Lobster, Georgia, serif'; x.fillText('Прописка', 104, cy + 16);
  const kind = TYPE_NAMES[h.type];
  if (kind){ x.textAlign = 'right'; x.font = '800 30px Manrope, Arial, sans-serif'; x.fillStyle = '#ffe2a8'; x.fillText(kind.toUpperCase(), 976, cy + 34); x.textAlign = 'left'; }
  const nm = h.name || 'Житель №' + h.n;
  x.fillStyle = '#152043'; fitText(x, nm, 590, 78, 800, 'Manrope, Arial, sans-serif'); x.fillText(nm, 104, cy + 140);
  const addr = `${h.street}, дом ${h.number}`;
  x.fillStyle = '#1f6a52'; fitText(x, addr, 590, 42, 800, 'Manrope, Arial, sans-serif'); x.fillText(addr, 106, cy + 248);
  const dt = h.date ? new Date(h.date.replace(' ','T') + 'Z') : null;
  const since = dt && !isNaN(dt) ? `в городе с ${dt.getUTCDate()} ${MONTHS[dt.getUTCMonth()]} ${dt.getUTCFullYear()}` : 'житель города';
  x.fillStyle = '#5a6688'; fitText(x, since, 590, 36, 700, 'Manrope, Arial, sans-serif'); x.fillText(since, 106, cy + 310);
  x.strokeStyle = 'rgba(21,32,67,.12)'; x.lineWidth = 2; x.beginPath(); x.moveTo(104, cy + 380); x.lineTo(976, cy + 380); x.stroke();
  x.fillStyle = '#d8352f'; x.font = '800 36px Manrope, Arial, sans-serif'; x.fillText('Найди свой дом — ссылка в профиле', 104, cy + 412);
  // печать
  x.save(); x.translate(860, cy + 228); x.rotate(-0.21);
  x.strokeStyle = '#d8352f'; x.lineWidth = 7; x.beginPath(); x.arc(0,0,112,0,Math.PI*2); x.stroke();
  x.lineWidth = 3; x.beginPath(); x.arc(0,0,95,0,Math.PI*2); x.stroke();
  x.fillStyle = '#d8352f'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '800 22px Manrope, Arial, sans-serif'; x.fillText('Ж И Т Е Л Ь', 0, -50);
  fitText(x, '№' + fmtNum(h.n), 160, 62, 800, 'Manrope, Arial, sans-serif'); x.fillText('№' + fmtNum(h.n), 0, 4);
  x.font = '700 24px Manrope, Arial, sans-serif'; x.fillText('из ' + fmtNum(total), 0, 54);
  x.restore();
  $('storyImg').src = out.toDataURL('image/jpeg', 0.92);
  $('storyModal').hidden = false;
}

/* ============================== загрузка ============================== */
function loadList(list){
  const data = normalize(list);
  closeSheets(); buildCity(data);
  $('sub').innerHTML = '';
  const b0 = document.createElement('b'); b0.textContent = fmtNum(total);
  $('sub').append(b0, document.createTextNode(` ${plural(total, ['житель','жителя','жителей'])} · каждый подписчик — дом`));
  const nx = goals.find(u => u.at > total);
  const prev = [...goals].reverse().find(u => u.at <= total)?.at ?? 0;
  const prog = nx ? (total - prev)/(nx.at - prev) : 1;
  const BULBS = 14, lit = Math.round(prog*BULBS);
  $('bulbs').replaceChildren(...Array.from({length:BULBS}, (_, i) => { const e = document.createElement('i'); if (i < lit) e.className = 'on'; return e; }));
  const ut = $('unlockTxt'); ut.replaceChildren();
  if (nx){
    const left = nx.at - total, b = document.createElement('b');
    b.textContent = nx.name;
    ut.append(document.createTextNode('Следующее: '), b, document.createTextNode(` — ещё ${fmtNum(left)} ${plural(left, ['житель','жителя','жителей'])}`));
  } else ut.textContent = 'Все места открыты';
}

function onResize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
  if (composer){ composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight); }
  const sc = scaleUniform(); pointMats.forEach(m => m.uniforms.uScale.value = sc);
  stars.material.uniforms.uPx.value = renderer.getPixelRatio();
}
addEventListener('resize', onResize);

function renderFrame(){ if (composer) composer.render(); else renderer.render(scene, camera); }

let last = performance.now(), clockT = 0, frameN = 0;
function loop(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; clockT += reduceMotion ? dt*0.3 : dt; frameN++;
  applyTime(cityHour(), clockT);
  updateCamera(dt);
  // небо, звёзды, сияние, луна — вокруг камеры
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  aurora.group.position.set(camera.position.x, 0, camera.position.z);
  moon.position.copy(camera.position).addScaledVector(moonDir, 2000);
  snow.material.uniforms.uCenter.value.set(camLook.x, 50, camLook.z);
  dir.position.copy(camLook).addScaledVector(lightDir, 200); dir.target.position.copy(camLook);
  if (bigStar){ bigStar.rotation.y += dt*0.6; }
  for (const sp of spinners) sp.rotation.y += dt*0.9;
  if (selRing && selRing.visible){ const k = 1 + Math.sin(clockT*3)*0.06; selRing.scale.x = selRing.scale.z = (Math.max(selected.w, selected.d)/9 + 0.6)*k; }
  if (frameN % 4 === 0) updateChunks();
  if (frameN % 6 === 0) pickLabels();
  if (frameN % 15 === 0){ updateSigns(); updateShopSigns(); }
  updateLabels();
  renderFrame();
  requestAnimationFrame(loop);
}

function showDraftBanner(){
  const b = document.createElement('div');
  b.style.cssText = 'position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);z-index:50;background:#ffb43a;color:#3a1a00;font:800 14px/1.2 Manrope,Arial,sans-serif;padding:9px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px)';
  const t = document.createElement('span'); t.textContent = 'Черновик из редактора: видишь только ты';
  const a = document.createElement('a'); a.textContent = 'выйти'; a.href = location.pathname; a.style.cssText = 'color:#3a1a00;text-decoration:underline';
  a.addEventListener('click', e => { e.preventDefault(); location.replace(location.pathname); });
  b.append(t, a); document.body.appendChild(b);
}
async function start(){
  try { await Promise.race([Promise.all([document.fonts.load('40px Lobster', 'Снежный город Каток Ярмарка'), document.fonts.load('800 40px Manrope', 'откроется жителях abc_09'), document.fonts.load('700 40px Manrope', 'Житель abc')]), new Promise(r => setTimeout(r, 2500))]); } catch(e){}
  let list = null;
  if (location.hash === '#draft'){
    try { const d = JSON.parse(localStorage.getItem('city-draft') || 'null'); const l = d && (Array.isArray(d) ? d : d.followers); if (Array.isArray(l) && l.length){ list = l; showDraftBanner(); } } catch(e){}
  }
  if (!list) try {
    const res = await fetch('followers.json', { cache:'no-store' });
    if (res.ok){ const j = await res.json(); list = Array.isArray(j) ? j : j.followers; }
  } catch(e){}
  if (!list || !list.length){ $('loadingTxt').textContent = 'Не получилось загрузить жителей. Проверь, что рядом с сайтом лежит файл followers.json.'; return; }
  loadList(list);
  const v = homeView(); camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); camLook.copy(v.target);
  onResize();
  requestAnimationFrame(loop);
  setTimeout(() => $('loading').classList.add('done'), 250);
  setTimeout(showHint, 900);
}
start();
})();
</script>
